name: Build and publish the version diff

on:
  push:
    branches: [main]
  schedule:
    # Tumbleweed moves daily; rebuild every morning (UTC).
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OSDIFF_COLUMNS: --extra leap160 --discover --repology
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep the compressed indexes between runs so --refresh only has to issue
      # a HEAD request per repository.  Unchanged files cost no mirror traffic;
      # the uncompressed copies (several GB) are rebuilt locally instead.
      # The repology cache rides along: it is tiny, and keeping it is what
      # holds that fetch to once a week instead of every morning.
      - name: Restore cached ARCHIVES indexes
        uses: actions/cache@v4
        with:
          path: |
            ARCHIVES_*.gz
            ARCHIVES_*.meta.json
            repology_newest.json
          key: archives-${{ github.run_id }}
          restore-keys: archives-

      # No python3-rpm on the runner, so osdiff falls back to its own
      # rpmvercmp; it is verified to agree with rpm's labelCompare.
      # Split per command so a failure names the step that broke.
      #
      # --extra leap160 adds the previous Leap as a column; --discover picks up
      # a 16.2 (…16.9) on the day its repository appears, so the published
      # table gains the next Leap without a commit here; --repology adds the
      # upstream column, refetched weekly off the cache above.  Every output
      # must be built with the same columns, hence the shared OSDIFF_COLUMNS.
      - name: Build index.html (refreshes the indexes)
        run: |
          mkdir -p _site
          python3 osdiff.py $OSDIFF_COLUMNS --refresh --format html -o _site/index.html

      - name: Build diff.json
        run: python3 osdiff.py $OSDIFF_COLUMNS --format json -o _site/diff.json --quiet

      - name: Build diff.csv
        run: python3 osdiff.py $OSDIFF_COLUMNS --format csv -o _site/diff.csv --maintainers --quiet

      - name: Compress and check the output
        run: |
          gzip -9 -k _site/diff.json
          # Fail loudly here rather than deploying a page without a table,
          # or one that quietly lost the extra distro columns.
          grep -q 'id="q"' _site/index.html
          grep -q 'data-k="x0"' _site/index.html
          grep -q 'data-k="up"' _site/index.html
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
